; Optional. Overrides SourceRootTemplate for one source environment.
; To be used if PROD has to pull the files QA received under se-deploy
; instead of the QA folders themselves.
;[SOURCEROOT]
;QA = {SERVER}\iciq@iciq\se-deploy


; Folders and files to synchronize, relative to the source folder.
; A line ending with \ means the folder and all its subfolders.
; A line without \ at the end is a single file, it is copied even if it is
; bigger than MaxFileSizeMB (a warning is written in the log).
[INCLUDE]
Se-common\bat\
Se-common\csv\
Se-Scripts\log\
Se-temp\QSR\QSR_Excecution.log

; Wildcards are allowed
[EXCLUDE]
Se-common\bat\Recov_Temp\
Se-common\bat\CFT_ACK.log
*.tmp
temp\*
