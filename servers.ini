; servers.ini - configuration for Sync-SeDeploy.ps1
; Location: E:\Data\se-iciq\se-deploy\servers.ini
; Nothing is hardcoded in the script, everything is read from this file.

[GLOBAL]
; Local folders on the server running the script
BasePath = E:\Data\se-iciq\
DestinationBasePath = E:\Data\se-iciq\se-deploy\
LogPath = E:\Data\se-iciq\se-deploy\Logs\

; How the source folder is built on the remote server.
; {SERVER} is replaced by the value of the server in [DEV] / [QA] / [PROD].
; iciq@iciq is the share that points to E:\Data\se-iciq on the servers.
SourceRootTemplate = {SERVER}\iciq@iciq

LogRetentionDays = 7
SyncIntervalMinutes = 10
MaxFileSizeMB = 100

; Threads used by robocopy (/MT)
MaxConcurrentCopies = 4

; Delete at the destination the files that no longer exist on the source (robocopy /PURGE).
; The deletion is skipped for a folder whose source is empty or unreadable, an empty
; listing is more often a share problem than a real deletion.
MirrorDeletions = True

; Only change this if robocopy.exe is not in the PATH
RobocopyPath = robocopy.exe

; Retry on network errors (not on access denied or disk full, those never succeed on retry)
RetryCount = 3
RetryDelaySeconds = 5

; Below this the cycle is skipped and a CRITICAL line is written
MinFreeSpaceMB = 1024

; A lock file older than this is considered as leftover from a crashed run
LockTimeoutMinutes = 60


; Destination environment = source environment.
; An environment can never be its own source (DEV to DEV is rejected at startup).
[MAPPING]
QA = DEV
PROD = QA


[DEV]
D1 = \\SYQDDWHDEV1.res.sys.shared.fortis
D2 = \\SYQDDWHDEV2.res.sys.shared.fortis

[QA]
Q1 = \\SYQCDWHQA1.res.sys.shared.fortis
Q2 = \\SYQCDWHQA2.res.sys.shared.fortis

[PROD]
P1 = \\SYQPDWHDB1.res.sys.shared.fortis
P3 = \\SYQPDWHDB3.res.sys.shared.fortis
P4 = \\SYQPDWHDB4.res.sys.shared.fortis
P5 = \\SYQPDWHDB5.res.sys.shared.fortis
P6 = \\SYQPDWHDB6.res.sys.shared.fortis
P9 = \\SYQPDWHDB9.res.sys.shared.fortis
; to be confirmed: this one is a DEV3 machine but listed in PROD
S3 = \\SYQDDWHDEV3.res.sys.shared.fortis


; Real computer name of each server, used only to recognize the machine the script is
; running on. The names above are the aliases used for the network access, the Windows
; computer name is different (mapping received from the infra team).
[HOSTNAMES]
D1 = s02v09928657
D2 = S01V09951973
Q1 = s02v09928659
Q2 = s01v09980381
P1 = S01V09986909
P3 = s01v09986905
P4 = S01V09954610
