; ============================================================================
;  servers.ini - configuration for Sync-SeDeploy.ps1
;  Location on every server: E:\Data\se-iciq\se-deploy\servers.ini
;  No value is hardcoded in the script; adding a server = editing this file.
; ============================================================================

[GLOBAL]
; Local paths on the machine running the script.
BasePath                  = E:\Data\se-iciq\
DestinationBasePath       = E:\Data\se-iciq\se-deploy\
LogPath                   = E:\Data\se-iciq\se-deploy\Logs\
; Optional, defaults to DestinationBasePath\se-deploy-sync.lock
LockFilePath              =

; How the source root is built on a remote server.
; {SERVER} is replaced by the value found in [DEV]/[QA]/[PROD], {CODE} by the code (D1, Q2, ...).
; Change E$ to a dedicated share name if administrative shares are not allowed for callssp.
SourceRootTemplate        = {SERVER}\E$\Data\se-iciq

LogRetentionDays          = 7
SyncIntervalMinutes       = 10
MaxFileSizeMB             = 100
MaxConcurrentCopies       = 4
RetryCount                = 3
RetryDelaySeconds         = 5
; Pause synchronization and log CRITICAL when the destination drive drops below this.
MinFreeSpaceMB            = 1024
DiskFullPauseMinutes      = 30
; A lock older than this (or whose process is gone) is considered stale and removed.
LockTimeoutMinutes        = 60
; Absorbs filesystem granularity and small clock differences between servers.
TimestampToleranceSeconds = 2
; Also re-copy when timestamps match but sizes differ.
CompareFileSize           = True
; Keep the source LastWriteTime on the copy, so a file is never copied twice.
PreserveTimestamps        = True
; "temp\*" also matches Se-common\temp\x.log when True.
MatchExcludeAtAnyDepth    = True
; Log a WARNING when an [INCLUDE] path does not exist on a source server.
; Set to False if some folders legitimately exist on only part of the servers.
WarnOnMissingIncludePath  = True

; Destination environment = source environment. An environment can never be its own source.
[MAPPING]
QA   = DEV
PROD = QA

[DEV]
D1 = \\SYQDDWHDEV1.res.sys.shared.fortis
D2 = \\SYQDDWHDEV2.res.sys.shared.fortis

[QA]
Q1 = \\SYQCDWHQA1.res.sys.shared.fortis
Q2 = \\SYQCDWHQA2.res.sys.shared.fortis

[PROD]
P1 = \\SYQPDWHDB1.res.sys.shared.fortis
P3 = \\SYQPDWHDB3.res.sys.shared.fortis
P4 = \\SYQPDWHDB4.res.sys.shared.fortis
P5 = \\SYQPDWHDB5.res.sys.shared.fortis
P6 = \\SYQPDWHDB6.res.sys.shared.fortis
P9 = \\SYQPDWHDB9.res.sys.shared.fortis
; NOTE: to be confirmed - the host name below is a DEV3 machine listed in the PROD section.
S3 = \\SYQDDWHDEV3.res.sys.shared.fortis

; Informational only, never used by the copy logic.
[CLUSTERS]
C1 = P1,P3,P4,P9,S3
C2 = P5,P6

; Optional. Overrides SourceRootTemplate per SOURCE environment.
; Use this if PROD must pull the files that QA itself received under se-deploy
; instead of QA's own live folders.
; [SOURCEROOT]
; QA = {SERVER}\E$\Data\se-iciq

; Paths relative to the source root. A trailing "\" means "this folder, recursively".
; A path without a trailing "\" is an explicitly listed single file: it is copied even
; when it exceeds MaxFileSizeMB (a WARNING is logged).
[INCLUDE]
Se-common\bat\
Se-common\csv\
Se-Scripts\log\
Se-temp\QSR\QSR_Excecution.log

; Wildcards supported. Evaluated against the path relative to the source root.
[EXCLUDE]
Se-common\bat\Recov_Temp\
Se-common\bat\CFT_ACK.log
*.tmp
temp\*
